[project]
name = "hftas"
version = "0.1.0"
description = "Launch the local Hammerfest game in Ruffle, optionally under libTAS"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
hftas = "hftas.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["eternaldev: needs eternaldev serving ./game on localhost:50317 (mise run game:serve)"]
