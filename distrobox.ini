# Dev container for the Hammerfest TAS project (Ruffle + libTAS).
# Create / update it with: distrobox assemble create --file distrobox.ini
# Enter it with:           distrobox enter hammerfest-tas

[hammerfest-tas]
image=docker.io/library/debian:13
pull=true
# Distinct hostname so the shell prompt shows user@hammerfest-tas-distrobox
hostname=hammerfest-tas-distrobox
# Tooling used by run.sh and mirror.py
additional_packages="curl jq ca-certificates git python3"
# Runtime libraries needed by Ruffle (audio, input, X11/Wayland, OpenGL/Vulkan)
additional_packages="libasound2t64 libudev1 libx11-6 libxcursor1 libxrandr2 libxi6 libxkbcommon0 libwayland-client0"
additional_packages="libgl1 libegl1 libvulkan1 mesa-vulkan-drivers fonts-dejavu-core"
# Install Ruffle desktop system-wide in the container (hooks run on every start, so skip if present)
init_hooks="test -x /usr/local/bin/ruffle || curl -fsSL https://github.com/ruffle-rs/ruffle/releases/download/v0.6.0/ruffle-0.6.0-linux-x86_64.tar.gz | tar -xz -C /usr/local/bin ruffle"
# Install libTAS (the .deb pulls its own dependencies: Qt5, ffmpeg, lua...). libTAS is X11-only.
init_hooks="test -x /usr/bin/libTAS || { curl -fsSL -o /tmp/libtas.deb https://github.com/clementgallet/libTAS/releases/download/v1.4.8/libtas_1.4.8_amd64.deb && apt-get install -y /tmp/libtas.deb && rm /tmp/libtas.deb; }"
