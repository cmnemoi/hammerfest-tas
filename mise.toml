# Tools to build the games (git submodules in games/).
# Run everything inside the distrobox: system deps are listed in distrobox.ini.

[tools]
node = "24"
haxe = "3.1.3" # patchman only works with Haxe 3.1.3

# swfmill has no Linux binary: compile it from source (build deps in distrobox.ini)
[tools."http:swfmill"]
version = "0.3.6"
url = "https://www.swfmill.org/releases/swfmill-{{version}}.tar.gz"
strip_components = 1
bin_path = "bin"
postinstall = "cd \"$MISE_TOOL_INSTALL_PATH\" && ./configure --prefix=\"$MISE_TOOL_INSTALL_PATH\" && make -j\"$(nproc)\" && make install"

[env]
# Haxe 3.1.3 does not find its standard library on its own
HAXE_STD_PATH = "{{ env.MISE_DATA_DIR | default(value=env.HOME ~ '/.local/share/mise') }}/installs/haxe/3.1.3/std"

[settings]
# Provides the yarn launcher; each game pins its own yarn release (.yarnrc.yml)
node.corepack = true
